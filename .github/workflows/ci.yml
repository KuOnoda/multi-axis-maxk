name: ci

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[train,test]'
      - run: python -m pip check
      - run: python -m pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q multi_axis_maxk flow_grpo training configs evaluation
      - run: python evaluation/generate_and_score.py --help
      - run: python evaluation/audit_clip.py --help
      - run: python evaluation/score_color_coverage.py --help
      - run: python -c "import runpy; runpy.run_path('training/train_sd3.py')"
