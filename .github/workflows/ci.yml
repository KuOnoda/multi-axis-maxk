name: ci

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -e '.[test]'
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q multi_axis_maxk flow_grpo training configs evaluation
